<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NITOJU Studio · 稿件展示</title>
  <link rel="icon" href="nitoju.png" type="image/png">
  <!-- 使用 Lucide 图标库 (通过 CDN 动态加载) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK (兼容版本) -->
  <script type="module">
    // 配置 Firebase (使用您的配置)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYXQTu_ZMq37kCbSBZUgD1twr5QvKLunM",
      authDomain: "aeribare.firebaseapp.com",
      projectId: "aeribare",
      storageBucket: "aeribare.firebasestorage.app",
      messagingSenderId: "602128037459",
      appId: "1:602128037459:web:370d2b0215247a74dab8a6",
      measurementId: "G-KWK7PXSW0J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 将 db 暴露到全局，方便后续使用（或者也可以在模块内使用）
    window.firestoreDB = db;
  </script>
  <style>
    /* ----- 全局样式 & 粉白可爱风 ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #fff5f9; /* 粉白背景 */
      color: #5a3e4b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 禁止右键/f12已经用js处理，这里不做额外样式 */

    /* 主容器 */
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 1.2rem;
      flex: 1;
      width: 100%;
    }

    /* 头部 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-area img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 6px 12px rgba(255, 182, 193, 0.3);
    }

    .studio-name {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(145deg, #ff8da1, #fdc0d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 4px 8px rgba(255, 200, 210, 0.4);
    }

    .lang-switch {
      background: white;
      border-radius: 50px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(255, 190, 200, 0.25);
      font-size: 0.95rem;
      font-weight: 500;
      color: #c95b7a;
      border: 1px solid #ffe2ea;
      transition: all 0.2s;
    }

    .lang-switch i {
      font-size: 1.1rem;
      color: #ff8da1;
    }

    /* 布局：左侧稿件 + 右侧联系卡 */
    .main-layout {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .gallery-section {
      flex: 2;
      min-width: 280px;
    }

    .contact-section {
      flex: 1;
      min-width: 260px;
      max-width: 340px;
    }

    /* 稿件网格 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .art-card {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(255, 170, 190, 0.18);
      transition: transform 0.25s, box-shadow 0.25s;
      border: 1px solid #ffeef3;
      display: flex;
      flex-direction: column;
    }

    .art-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 32px rgba(255, 140, 170, 0.25);
    }

    .art-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #fce4ec;
      display: block;
    }

    .art-info {
      padding: 1rem 1rem 1.2rem;
    }

    .art-tag {
      display: inline-block;
      background: #ffe2ea;
      color: #b34a66;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
      margin-bottom: 0.5rem;
      border: 1px solid #ffc1d0;
    }

    .art-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #4e2e3a;
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .art-desc {
      font-size: 0.9rem;
      color: #a16b7c;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .art-meta {
      font-size: 0.7rem;
      color: #d99aab;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    /* 联系卡片 */
    .contact-card {
      background: white;
      border-radius: 32px;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 18px 32px rgba(255, 180, 200, 0.2);
      border: 1px solid #ffe6ee;
      position: sticky;
      top: 1.5rem;
    }

    .contact-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ff8da1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: -0.3px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #fff7fa;
      border-radius: 60px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1rem;
      transition: all 0.2s;
      border: 1px solid #ffdae5;
      text-decoration: none;
      color: inherit;
    }

    .contact-item:hover {
      background: #ffeef3;
      border-color: #ffb8cc;
      transform: scale(1.01);
    }

    .contact-icon {
      width: 40px;
      height: 40px;
      background: #ffe2ea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff6f91;
      font-size: 1.4rem;
    }

    .contact-text {
      font-weight: 600;
      color: #6b3d4f;
      flex: 1;
    }

    .qr-wrapper {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #fff7fa;
      border-radius: 60px;
      padding: 0.7rem 1.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid #ffdae5;
    }

    .qr-wrapper img {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid white;
      box-shadow: 0 4px 12px rgba(255, 160, 180, 0.25);
    }

    .qr-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b3d4f;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .qr-label i {
      color: #ff8da1;
    }

    /* 加载中 / 空状态 */
    .loading, .empty {
      text-align: center;
      padding: 3rem 1rem;
      background: #fff0f5;
      border-radius: 36px;
      color: #c08398;
      font-weight: 500;
    }

    .loading i {
      animation: spin 1s infinite linear;
      display: inline-block;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 手机适配 */
    @media (max-width: 700px) {
      .app { padding: 1rem; }
      .studio-name { font-size: 1.4rem; }
      .logo-area img { width: 36px; height: 36px; }
      .header { margin-bottom: 1.2rem; }
      .main-layout { flex-direction: column; gap: 1.5rem; }
      .contact-card { position: static; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
      .art-image { height: 150px; }
      .art-title { font-size: 1rem; }
      .contact-section { max-width: 100%; }
    }

    @media (max-width: 400px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }

    /* 隐藏元素 */
    .hidden { display: none; }

    /* 版权footer */
    .footer {
      text-align: center;
      padding: 1.5rem;
      color: #d29eb0;
      font-size: 0.8rem;
      border-top: 1px solid #ffe2ea;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部区域 -->
    <header class="header">
      <div class="logo-area">
        <img src="nitoju.png" alt="NITOJU Studio logo">
        <span class="studio-name">NITOJU Studio</span>
      </div>
      <div class="lang-switch" id="langIndicator">
        <i data-lucide="languages"></i>
        <span id="langText">EN</span>
      </div>
    </header>

    <!-- 主布局: 稿件 + 联系 -->
    <div class="main-layout">
      <!-- 左侧稿件展示 -->
      <section class="gallery-section">
        <h2 style="font-size:1.4rem; display:flex; align-items:center; gap:0.5rem; color:#b34a66; margin-bottom:1rem;">
          <i data-lucide="image" style="color:#ff8da1;"></i>
          <span id="galleryTitle">全部作品</span>
        </h2>
        <div id="galleryContainer" class="gallery-grid">
          <!-- 动态加载稿件卡片 -->
          <div class="loading" id="loadingIndicator">
            <i data-lucide="loader-2"></i> <span id="loadingText">加载作品中…</span>
          </div>
        </div>
      </section>

      <!-- 右侧联系卡片 -->
      <aside class="contact-section">
        <div class="contact-card">
          <div class="contact-title">
            <i data-lucide="message-circle-heart"></i>
            <span id="contactTitle">联系 & 打赏</span>
          </div>
          <!-- Facebook -->
          <a href="https://www.facebook.com/ari.bare.86866?rdid=1EaUKUDKJYvCWBqP&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F19JhjNVtCH%2F#" 
             target="_blank" class="contact-item">
            <div class="contact-icon"><i data-lucide="facebook"></i></div>
            <span class="contact-text" id="fbLabel">Facebook</span>
          </a>
          <!-- 打赏 QR -->
          <div class="qr-wrapper">
            <img src="payment.jpg" alt="打赏二维码">
            <div class="qr-label">
              <i data-lucide="qr-code"></i>
              <span id="qrLabel">扫码打赏</span>
            </div>
          </div>
          <!-- 额外装饰 -->
          <div style="margin-top:1rem; text-align:center; font-size:0.8rem; color:#dfa6b8;">
            <i data-lucide="heart" style="width:14px; height:14px;"></i>
            <span id="thanksText">感谢支持</span>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <footer class="footer">
    <span id="footerText">© 2025 NITOJU Studio · 可爱稿件展示</span>
  </footer>

  <!-- 主要脚本：国际化、加载Firestore、防右键/F12 -->
  <script type="module">
    // ----- 1. 语言检测与国际化 -----
    const userLang = navigator.language || navigator.userLanguage;
    const isChinese = userLang.toLowerCase().startsWith('zh');
    // 根据语言设定文本
    const i18n = {
      zh: {
        galleryTitle: '全部作品',
        loading: '加载作品中…',
        empty: '还没有稿件哦，敬请期待✨',
        contactTitle: '联系 & 打赏',
        fbLabel: 'Facebook',
        qrLabel: '扫码打赏',
        thanksText: '感谢支持',
        footerText: '© 2025 NITOJU Studio · 可爱稿件展示',
        langIndicator: '中文',
        // 卡片内无需额外翻译，标签/标题来自数据
      },
      en: {
        galleryTitle: 'All Works',
        loading: 'Loading works…',
        empty: 'No artworks yet. Stay tuned ✨',
        contactTitle: 'Contact & Support',
        fbLabel: 'Facebook',
        qrLabel: 'Scan to tip',
        thanksText: 'Thank you',
        footerText: '© 2025 NITOJU Studio · Cute artworks',
        langIndicator: 'EN',
      }
    };

    const t = isChinese ? i18n.zh : i18n.en;
    // 应用文本
    document.getElementById('galleryTitle').textContent = t.galleryTitle;
    document.getElementById('loadingText').textContent = t.loading;
    document.getElementById('contactTitle').textContent = t.contactTitle;
    document.getElementById('fbLabel').textContent = t.fbLabel;
    document.getElementById('qrLabel').textContent = t.qrLabel;
    document.getElementById('thanksText').textContent = t.thanksText;
    document.getElementById('footerText').textContent = t.footerText;
    document.getElementById('langText').textContent = t.langIndicator;
    document.documentElement.lang = isChinese ? 'zh' : 'en';

    // ----- 2. 图标渲染 (Lucide) -----
    function renderIcons() {
      if (window.lucide) {
        lucide.createIcons();
      } else {
        // 若未加载完成，等一秒重试
        setTimeout(renderIcons, 100);
      }
    }
    renderIcons();

    // ----- 3. 禁用右键和 F12 (以及开发者工具快捷键) -----
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      // 禁用 F12
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
      // 禁用 Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C / Ctrl+U
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
        e.preventDefault();
        return false;
      }
      if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        return false;
      }
    });

    // ----- 4. 从 Firestore 加载作品数据 -----
    const galleryContainer = document.getElementById('galleryContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');

    // 等待 firebase 模块初始化完成 (db 挂载在 window)
    async function loadArtworks() {
      try {
        // 等待一小段时间确保 window.firestoreDB 存在 (模块加载异步)
        if (!window.firestoreDB) {
          await new Promise(resolve => setTimeout(resolve, 600));
        }
        const db = window.firestoreDB;
        if (!db) throw new Error('Firestore not initialized');

        // 引入所需的 Firestore 函数 (动态导入，因为上面已经 import 过但未暴露)
        const { collection, getDocs, query, orderBy } = await import("https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js");
        
        // 查询作品集合 (假设集合名为 "artworks"，您可以根据实际修改)
        const artworksRef = collection(db, "artworks");
        // 按时间降序，如果有 createdAt 字段 (如果没有就忽略排序)
        let q;
        try {
          q = query(artworksRef, orderBy("createdAt", "desc"));
        } catch (e) {
          // 没有 createdAt 字段或索引时直接获取全部
          q = query(artworksRef);
        }
        const snapshot = await getDocs(q);

        // 隐藏加载状态
        if (loadingIndicator) loadingIndicator.style.display = 'none';

        if (snapshot.empty) {
          // 显示空状态
          galleryContainer.innerHTML = `
            <div class="empty" style="grid-column:1/-1;">
              <i data-lucide="image-off" style="width:40px;height:40px;color:#ffb0c3;margin-bottom:0.8rem;"></i>
              <p>${t.empty}</p>
            </div>
          `;
          renderIcons();
          return;
        }

        // 清空容器
        galleryContainer.innerHTML = '';

        // 遍历文档，生成卡片
        snapshot.forEach((doc) => {
          const data = doc.data();
          // 字段映射: title, description, tags, imageUrl, createdAt
          const title = data.title || (isChinese ? '无标题' : 'Untitled');
          const description = data.description || data.details || (isChinese ? '暂无描述' : 'No description');
          const tags = data.tags || (isChinese ? '未分类' : 'Uncategorized');
          const imageUrl = data.imageUrl || 'https://via.placeholder.com/400x300?text=No+Image'; // 占位图
          // 如果图片为空或无效也可以使用占位
          const finalImage = imageUrl.trim() !== '' ? imageUrl : 'https://via.placeholder.com/400x300?text=No+Image';

          // 构建卡片 HTML (使用 innerHTML 方式)
          const card = document.createElement('div');
          card.className = 'art-card';
          // 转义 HTML 特殊字符 (简单处理)
          const safeTitle = title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const safeDesc = description.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const safeTags = tags.replace(/</g, '&lt;').replace(/>/g, '&gt;');

          card.innerHTML = `
            <img class="art-image" src="${finalImage}" alt="${safeTitle}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">
            <div class="art-info">
              <div class="art-tag">${safeTags}</div>
              <div class="art-title">${safeTitle}</div>
              <div class="art-desc">${safeDesc}</div>
              <div class="art-meta">
                <i data-lucide="calendar" style="width:14px;height:14px;"></i>
                <span>${data.date || ''}</span>
              </div>
            </div>
          `;
          galleryContainer.appendChild(card);
        });

        // 重新渲染图标
        renderIcons();
      } catch (error) {
        console.error('加载作品失败:', error);
        if (loadingIndicator) loadingIndicator.style.display = 'none';
        galleryContainer.innerHTML = `
          <div class="empty" style="grid-column:1/-1;">
            <i data-lucide="cloud-off" style="width:40px;height:40px;color:#ffb0c3;margin-bottom:0.8rem;"></i>
            <p>${isChinese ? '加载失败，请稍后再试' : 'Failed to load. Please try again later.'}</p>
          </div>
        `;
        renderIcons();
      }
    }

    // 启动加载
    loadArtworks();

    // 确保所有图标更新（若动态加载较慢，多次调用）
    window.addEventListener('load', () => {
      renderIcons();
      // 以防第一次加载时lucide还没准备好
      setTimeout(renderIcons, 300);
    });

    // 监听 lucide 加载完成
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    } else {
      const checkLucide = setInterval(() => {
        if (window.lucide) {
          lucide.createIcons();
          clearInterval(checkLucide);
        }
      }, 200);
    }
  </script>

  <!-- 确保 lucide 在加载完毕后渲染一次 (再次补充) -->
  <script>
    // 不依赖模块的简单图标刷新
    window.addEventListener('load', function() {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
